/* 工程表：横軸が工程、縦軸が担当。人の判断は塗り、機械チェックは面取りの関門で区別する */
:root {
  --bg:#fafbfb; --ink:#16242c; --muted:#4f616b; --line:#a9b7bf; --lane:#eff3f5; --card:#ffffff;
  --human:#0e4a6b; --human-ink:#ffffff; --gate:#a65800; --gate-bg:#fff2df; --band:#dde6ea; --arrow:#43545c;

}
@media screen and (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#11181d; --ink:#e7eff3; --muted:#a3b4bd; --line:#4a5a63; --lane:#18232a; --card:#1c282f; --human:#58aed8; --human-ink:#06202d; --gate:#eea640; --gate-bg:#2b2113; --band:#26343c; --arrow:#9fb1ba; color-scheme:dark; } }
@media screen { :root[data-theme="dark"] { --bg:#11181d; --ink:#e7eff3; --muted:#a3b4bd; --line:#4a5a63; --lane:#18232a; --card:#1c282f; --human:#58aed8; --human-ink:#06202d; --gate:#eea640; --gate-bg:#2b2113; --band:#26343c; --arrow:#9fb1ba; color-scheme:dark; } }
body { background:var(--bg); color:var(--ink); font-family:var(--font); }
.sheet { padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.scroll { overflow-x:auto; }
.scroll svg { display:block; width:100%; min-width:1120px; max-width:1760px; height:auto; margin-inline:auto; font-family:var(--font); }
.paper { fill:var(--bg); }
.h1 { fill:var(--ink); font-size:36px; font-weight:700; }
.lead { fill:var(--muted); font-size:19px; }
.legend text { fill:var(--muted); font-size:15px; }
.phase { fill:var(--band); }
.phase-t { fill:var(--ink); font-size:19px; font-weight:700; text-anchor:middle; }
.phase-n { fill:var(--human); }
.lane { fill:var(--lane); }
.rule { stroke:var(--line); stroke-width:1; fill:none; }
.l-name { fill:var(--ink); font-size:21px; font-weight:700; }
.l-role { fill:var(--muted); font-size:16px; }
.node rect, .node polygon { stroke-width:1.6; }
.node.ai rect { fill:var(--card); stroke:var(--line); }
.node.human rect { fill:var(--human); stroke:var(--human); }
.node.gate polygon { fill:var(--gate-bg); stroke:var(--gate); stroke-width:2; }
.n-title { fill:var(--ink); font-size:18px; font-weight:700; text-anchor:middle; }
.n-sub { fill:var(--muted); font-size:16px; text-anchor:middle; }
.node.human .n-title, .node.human .n-sub { fill:var(--human-ink); }
.flow { fill:none; stroke:var(--arrow); stroke-width:1.8; }
.flow.dashed { stroke-dasharray:6 5; }
.tip { fill:var(--arrow); }
.edge { fill:var(--muted); font-size:15px; }
.loop { fill:var(--gate); font-size:16.5px; font-weight:700; text-anchor:middle; }
.f-head { fill:var(--muted); font-size:16px; font-weight:700; }
.f-title { fill:var(--ink); font-size:20px; font-weight:700; }
.f-body { fill:var(--muted); font-size:16px; }
.f-note { fill:var(--muted); font-size:15px; }
@page { size:A4 landscape; margin:10mm; }
@media print {
  :root { --muted:#34444c; --bg:#ffffff; }
  html, body { margin:0; background:#fff; }
  .sheet { padding:0 !important; }
  .scroll { overflow:visible; }
  .scroll svg { width:277mm; min-width:0; max-width:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}

ub" x="838" y="501">指摘の妥当性を確かめ、</text><text class="n-sub" x="838" y="523">反映する修正を選ぶ</text></g><g class="node ai"><rect x="726" y="309" width="224" height="96" rx="9"/><text class="n-title" x="838" y="341">別視点のレビュー</text><text class="n-sub" x="838" y="367">表現と読みやすさを確認し、</text><text class="n-sub" x="838" y="389">修正案を提示する</text></g><g class="node human"><rect x="726" y="175" width="224" height="96" rx="9"/><text class="n-title" x="838" y="207">前提と仕様の確認</text><text class="n-sub" x="838" y="233">未確認事項は</text><text class="n-sub" x="838" y="255">AIに推測で補わせない</text></g><g class="node ai"><rect x="978" y="577" width="224" height="96" rx="9"/><text class="n-title" x="1090" y="609">修正を新しい版に反映</text><text class="n-sub" x="1090" y="635">版番号を付け、</text><text class="n-sub" x="1090" y="657">元の版はそのまま残す</text></g><g class="node gate"><polygon points="991,711 1189,711 1202,724 1202,794 1189,807 991,807 978,794 978,724"/><text class="n-title" x="1090" y="743">実行前チェック</text><text class="n-sub" x="1090" y="769">成果物とレビュー記録を</text><text class="n-sub" x="1090" y="791">ハッシュで照合する</text></g><g class="node human"><rect x="1230" y="175" width="224" height="96" rx="9"/><text class="n-title" x="1342" y="207">外部操作の承認</text><text class="n-sub" x="1342" y="233">対象と操作は</text><text class="n-sub" x="1342" y="255">私が承認した範囲に限る</text></g><g class="node ai"><rect x="1230" y="577" width="224" height="96" rx="9"/><text class="n-title" x="1342" y="609">実行と記録</text><text class="n-sub" x="1342" y="635">実施済みか確認して進め、</text><text class="n-sub" x="1342" y="657">結果を読み戻して台帳に記録</text></g><g class="node gate"><polygon points="1243,711 1441,711 1454,724 1454,794 1441,807 1243,807 1230,794 1230,724"/><text class="n-title" x="1342" y="743">完了とロック解放</text><text class="n-sub" x="1342" y="769">保持者を照合し、</text><text class="n-sub" x="1342" y="791">完了記録を残して解放する</text></g><g class="node human"><rect x="1482" y="175" width="224" height="96" rx="9"/><text class="n-title" x="1594" y="207">方針の見直し</text><text class="n-sub" x="1594" y="233">役割分担と</text><text class="n-sub" x="1594" y="255">レビューの順序を再設定する</text></g><g class="node ai"><rect x="1482" y="443" width="224" height="96" rx="9"/><text class="n-title" x="1594" y="475">原因の整理</text><text class="n-sub" x="1594" y="501">既存のルールで</text><text class="n-sub" x="1594" y="523">防げなかった原因を記録する</text></g><g class="node ai"><rect x="1482" y="577" width="224" height="96" rx="9"/><text class="n-title" x="1594" y="609">チェックの追加</text><text class="n-sub" x="1594" y="635">チェック処理とテストを</text><text class="n-sub" x="1594" y="657">コードで実装する</text></g><text class="edge" x="984" y="362" text-anchor="start">必要な未確認事項は私へ</text><text class="edge" x="838" y="716" text-anchor="middle">レビュー対象外のとき</text><text class="edge" x="1050" y="697" text-anchor="end">不合格</text><text class="edge" x="1454" y="496" text-anchor="end">問題が起きたら</text><rect class="paper" x="794" y="833" width="340" height="26"/><text class="loop" x="964" y="852">追加したチェックで次回から止める</text><text class="f-head" x="40" y="900">運用で重視していること</text><text class="f-title" x="40" y="934">作成とレビューを分ける</text><text class="f-body" x="40" y="962">レビュー対象の文章は、作成者とは別のAIが確認する</text><text class="f-title" x="460" y="934">取り消せない操作の前で止める</text><text class="f-body" x="460" y="962">実施済みか確認し、合格した版だけを承認範囲内で扱う</text><text class="f-title" x="880" y="934">失敗を仕組みに変える</text><text class="f-body" x="880" y="962">再発防止策を記録し、必要に応じてチェックを追加する</text><text class="f-title" x="1300" y="934">限られた利用枠を重要工程に充てる</text><text class="f-body" x="1300" y="962">一次レビューをCodexに任せ、最終レビューの枠を残す</text></svg></div></main></body></html>
